<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3d57"/>
      <stop offset="1" stop-color="#161d2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="226" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc861" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff9f2e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#f6c66e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a24c"/>
      <stop offset="1" stop-color="#a87726"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b8c"/>
      <stop offset="1" stop-color="#34405a"/>
    </linearGradient>
    <clipPath id="window"><rect x="148" y="132" width="216" height="196" rx="6"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#8fa6cc" stroke-opacity="0.35" stroke-width="6"/>

  <g transform="translate(256 260) scale(1.12) translate(-256 -251)">
  <!-- Panel thickness (right edge) -->
  <path d="M380 112 L398 126 L398 362 L380 352 Z" fill="#7d5719"/>
  <!-- Panel frame (the lithophane border) -->
  <rect x="128" y="112" width="256" height="240" rx="10" fill="url(#frame)"/>

  <!-- Backlit image: thin areas glow, thick areas are darker -->
  <g clip-path="url(#window)">
    <rect x="148" y="132" width="216" height="196" fill="url(#sky)"/>
    <circle cx="316" cy="182" r="40" fill="#fff7d6" opacity="0.6"/>
    <circle cx="316" cy="182" r="25" fill="#fffdf3"/>
    <path d="M140 266 L182 222 L204 238 L236 196 L268 234 L292 216 L330 252 L372 230 L372 340 L140 340 Z"
          fill="#e2a24a"/>
    <path d="M140 296 L174 270 L204 288 L242 254 L282 286 L314 266 L372 296 L372 340 L140 340 Z"
          fill="#b97a2a"/>
    <path d="M140 340 L140 316 L168 300 L198 314 L232 294 L262 312 L300 296 L336 314 L372 304 L372 340 Z"
          fill="#8a5718"/>
  </g>

  <!-- Light support base -->
  <rect x="104" y="344" width="304" height="46" rx="12" fill="url(#base)"/>
  <rect x="120" y="344" width="272" height="6" rx="3" fill="#ffd27a" opacity="0.85"/>
  <rect x="104" y="384" width="304" height="6" rx="3" fill="#1f2738" opacity="0.6"/>
  </g>
</svg>
